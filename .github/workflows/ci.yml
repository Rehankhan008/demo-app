name: cicd 

on:
  push:

jobs:
  docker:
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: rehan008/demo-app:${{ github.sha }}

  deploy:
    needs: docker 
    
    runs-on: ubuntu-latest
    environment: EC2
    steps:
    - name: SSH deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.KEY }}
        port: ${{ secrets.PORT }}
        script: |

            sudo apt-get update -y
              
            sudo apt install apt-transport-https ca-certificates curl software-properties-common -y
            # Add Docker GPG key
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -

            # Add Docker APT repository
            sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable" -y
            sudo apt-cache policy docker-ce 
            sudo apt install docker-ce -y
            sudo systemctl status docker
            sudo usermod -aG docker ubuntu
            sudo newgrp docker

             # Stop and remove the old container (if it exists)
            sudo docker ps -a -q --filter "name=demo-app" | xargs -r docker stop
            sudo docker ps -a -q --filter "name=demo-app" | xargs -r docker rm

            docker pull rehan008/demo-app:${{ github.sha }}
            docker run -d --name demo-app -p 5000:5000 rehan008/demo-app:latest